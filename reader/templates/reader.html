<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ note.title }} · Noteful Reader</title>
<style>
  :root { --bar:#1e1e1c; --ink:#eee; --muted:#aaa; --line:#3a3a37; --accent:#7fd1b0; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:#262624; color:var(--ink); font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; }
  header { background:var(--bar); border-bottom:1px solid #000; padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; flex:none; }
  a.back { color:var(--muted); text-decoration:none; font-size:18px; padding:0 6px; }
  a.back:hover { color:#fff; }
  .title { font-weight:600; font-size:15px; max-width:26vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .spacer { flex:1; }
  .nav,.zoom { display:flex; align-items:center; gap:6px; }
  button { background:#333; color:var(--ink); border:1px solid var(--line); border-radius:7px; min-width:34px; height:32px; padding:0 9px; cursor:pointer; font-size:13px; }
  button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.35; cursor:default; }
  button.on { border-color:var(--accent); color:var(--accent); background:#24332e; }
  .count { min-width:128px; text-align:center; color:var(--muted); font-variant-numeric:tabular-nums; }
  .count input { width:52px; background:#2b2b29; color:var(--ink); border:1px solid var(--line); border-radius:5px; text-align:center; padding:4px; }
  #stage { flex:1; overflow:auto; display:flex; align-items:flex-start; justify-content:center; gap:18px; padding:24px; }
  #pageA,#pageB { max-width:none; box-shadow:0 6px 30px rgba(0,0,0,.45); background:#fff; transform-origin:top center; }
  #pageB { display:none; }
  #stage.spread #pageB { display:block; }
  #status { flex:none; background:var(--bar); border-top:1px solid #000; color:var(--muted); padding:6px 16px; font-size:12px; min-height:29px; }
  .hint { opacity:.65; }
  @media (max-width:820px){ .title{max-width:22vw} .count{min-width:96px} }
</style>
</head>
<body>
<header>
  <a class="back" href="/" title="Back to library">←</a>
  <span class="title" title="{{ note.title }}">{{ note.title }}</span>
  <span class="spacer"></span>
  <div class="nav">
    <button id="first" title="First page">⇤</button>
    <button id="prev" title="Previous page (←)">‹</button>
    <span class="count"><input id="pageno" type="number" min="1" max="{{ note.pages }}" value="1"><span id="range"></span> / {{ '{:,}'.format(note.pages) }}</span>
    <button id="next" title="Next page (→)">›</button>
    <button id="last" title="Last page">⇥</button>
  </div>
  <span class="spacer"></span>
  <button id="spread" title="Toggle side-by-side pages (2)">1 page</button>
  <div class="zoom">
    <button id="out" title="Zoom out (−)">−</button>
    <button id="fit" title="Fit page(s) (0)">Fit</button>
    <button id="in" title="Zoom in (+)">+</button>
  </div>
</header>
<div id="stage"><img id="pageA" alt="Note page"><img id="pageB" alt="Note page"></div>
<div id="status"><span class="hint">←/→ pages · 1/2 layout · +/- zoom · 0 fit · type a page number and press Enter</span></div>

<script>
(function(){
  const id = {{ note.id|tojson }};
  const total = {{ note.pages }};
  const imgA = document.getElementById('pageA');
  const imgB = document.getElementById('pageB');
  const stage = document.getElementById('stage');
  const pageno = document.getElementById('pageno');
  const range  = document.getElementById('range');
  const status = document.getElementById('status');
  const spreadBtn = document.getElementById('spread');
  const fitBtn = document.getElementById('fit');
  const hint = '<span class="hint">←/→ pages · 1/2 layout · +/- zoom · 0 fit · type a page number and press Enter</span>';
  {% set start = request.args.get('p', '0')|int %}
  let page = {{ start if start >= 0 and start < note.pages else 0 }}, scale = null, loading = false;
  let spread = {{ 'true' if request.args.get('spread') in ('1','true','yes') else 'false' }};

  function step(){ return spread ? 2 : 1; }
  function align(p){ return spread ? p - (p % 2) : p; }
  function visibleImgs(){ return spread ? [imgA, imgB] : [imgA]; }
  function src(p){ return '/page/' + id + '/' + p + '.svg?t=' + Date.now(); }

  function updateCounter(){
    pageno.value = page + 1;
    range.textContent = (spread && page + 1 < total) ? '–' + (page + 2) : '';
    spreadBtn.textContent = spread ? '2 pages' : '1 page';
    spreadBtn.classList.toggle('on', spread);
    stage.classList.toggle('spread', spread);
  }

  function loadInto(img, p){
    return new Promise(function(resolve, reject){
      if(p >= total){ img.style.display = 'none'; img.removeAttribute('src'); return resolve(); }
      img.style.display = '';
      const probe = new Image();
      probe.onload = function(){ img.src = probe.src; resolve(); };
      probe.onerror = function(){ reject(new Error('page ' + p)); };
      probe.src = src(p);
    });
  }

  function show(p, force){
    const target = Math.max(0, Math.min(total - 1, align(p)));
    if(!force && target === page && imgA.getAttribute('src')) return;
    page = target;
    loading = true;
    status.textContent = 'Loading page ' + (page + 1) + ' …';
    Promise.all([
      loadInto(imgA, page),
      loadInto(imgB, spread ? page + 1 : total)
    ]).then(function(){
      if(scale) apply(); else fit();
      updateCounter();
      loading = false;
      status.innerHTML = hint;
    }).catch(function(){
      loading = false;
      status.textContent = 'Could not load page ' + (page + 1) + '.';
    });
  }

  function fit(){
    const imgs = visibleImgs().filter(function(i){ return i.naturalWidth && i.getAttribute('src'); });
    if(!imgs.length) return;
    fitBtn.dataset.mode = 'on';
    const pad = 48, gap = 18;
    const availW = stage.clientWidth - pad - (imgs.length > 1 ? gap : 0);
    const natW = imgs.reduce(function(a, i){ return a + i.naturalWidth; }, 0);
    const natH = Math.max.apply(null, imgs.map(function(i){ return i.naturalHeight; }));
    scale = Math.min(availW / natW, (stage.clientHeight - pad) / natH, 2);
    apply();
  }

  function apply(){
    if(!scale) return;
    visibleImgs().forEach(function(i){
      if(i.naturalWidth) i.style.width = (i.naturalWidth * scale) + 'px';
      i.style.height = 'auto';
    });
  }

  function zoom(mult){
    if(!scale) fit();
    scale = Math.max(.15, Math.min(6, scale * mult));
    fitBtn.dataset.mode = 'off';
    apply();
  }

  function toggleSpread(){
    spread = !spread;
    scale = null;
    const url = new URL(window.location.href);
    if(spread) url.searchParams.set('spread','1'); else url.searchParams.delete('spread');
    history.replaceState(null, '', url);
    show(page, true);
  }

  imgA.addEventListener('load', function(){ if(scale) apply(); else fit(); });
  imgB.addEventListener('load', function(){ if(scale) apply(); else fit(); });
  document.getElementById('first').onclick = function(){ show(0); };
  document.getElementById('prev').onclick  = function(){ show(page - step()); };
  document.getElementById('next').onclick  = function(){ show(page + step()); };
  document.getElementById('last').onclick  = function(){ show(total - 1); };
  spreadBtn.onclick = toggleSpread;
  document.getElementById('in').onclick    = function(){ zoom(1.25); };
  document.getElementById('out').onclick   = function(){ zoom(1/1.25); };
  fitBtn.onclick = fit;
  pageno.addEventListener('change', function(){
    const n = parseInt(pageno.value, 10);
    if(!isNaN(n)) show(n - 1); else updateCounter();
  });
  window.addEventListener('resize', function(){ if(fitBtn.dataset.mode !== 'off') fit(); });
  document.addEventListener('keydown', function(e){
    if(document.activeElement === pageno) return;
    if(e.key === 'ArrowRight' || e.key === 'PageDown'){ show(page + step()); e.preventDefault(); }
    else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ show(page - step()); e.preventDefault(); }
    else if(e.key === 'Home'){ show(0); e.preventDefault(); }
    else if(e.key === 'End'){ show(total - 1); e.preventDefault(); }
    else if(e.key === '+' || e.key === '='){ zoom(1.25); e.preventDefault(); }
    else if(e.key === '-'){ zoom(1/1.25); e.preventDefault(); }
    else if(e.key === '0'){ fit(); e.preventDefault(); }
    else if(e.key === '2'){ toggleSpread(); e.preventDefault(); }
  });

  updateCounter();
  show(page, true);
})();
</script>
</body>
</html>
